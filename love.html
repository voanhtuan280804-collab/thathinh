<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mình Yêu Bạn 💖</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  height:100vh;
  background:linear-gradient(#ffe6f0,#ffb6c1);
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Segoe UI',sans-serif;
  overflow:hidden;
  text-align:center;
}
#message{font-size:10vw;color:#ff0066;text-shadow:3px 3px 8px #fff;margin-bottom:2vh;}
#content{font-size:4vw;max-width:90vw;opacity:0;text-shadow:1px 1px 3px #fff;transition:opacity 1s;}
.heart{position:absolute;font-size:3vw;pointer-events:none;animation:fly linear forwards;}
.bigHeart{font-size:16vw;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);opacity:0;color:#ff3366;text-shadow:0 0 20px #ff6699,0 0 40px #ff99cc;}
@keyframes fly{0%{transform:translateY(0) rotate(0deg) scale(1);opacity:1}100%{transform:translateY(-50vh) rotate(720deg) scale(2);opacity:0}}
@keyframes heartBoom{0%{transform:translate(-50%,-50%) scale(0);opacity:0}50%{transform:translate(-50%,-50%) scale(2);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
/* Điện thoại nhỏ */
@media screen and (max-width: 360px) {
  #question { font-size: 6vw; }
  .btn { font-size: 3vw; padding: 1.5vh 3vw; }
  #message { font-size: 8vw; }
  #content { font-size: 3.5vw; }
}

/* Điện thoại lớn */
@media screen and (max-width: 480px) {
  #question { font-size: 7vw; }
  .btn { font-size: 3.5vw; padding: 2vh 4vw; }
  #message { font-size: 9vw; }
  #content { font-size: 4vw; }
}

/* Tablet nhỏ */
@media screen and (max-width: 600px) {
  #question { font-size: 8vw; }
  .btn { font-size: 4vw; padding: 2vh 4vw; }
  #message { font-size: 10vw; }
  #content { font-size: 4.5vw; }
}

/* Tablet lớn */
@media screen and (max-width: 768px) {
  #question { font-size: 9vw; }
  .btn { font-size: 4.5vw; padding: 2.5vh 5vw; }
  #message { font-size: 11vw; }
  #content { font-size: 5vw; }
}

/* Laptop / Desktop */
@media screen and (min-width: 769px) {
  #question { font-size: 36px; }
  .btn { font-size: 24px; padding: 15px 30px; }
  #message { font-size: 60px; }
  #content { font-size: 24px; }
}

</style>
</head>
<body>

<div>
  <div id="message">Mình yêu bạn 💖</div>
  <div id="content"></div>
</div>

<audio id="loveMusic" src="music/love-love-song-music-277935.mp3" loop></audio>

<script>
const content=document.getElementById('content');
const loveMusic=document.getElementById('loveMusic');

// Nhạc bật khi người dùng chạm vào trang lần đầu
let musicStarted=false;
function startMusicOnce(){
  if(!musicStarted){
    loveMusic.play();
    musicStarted=true;
  }
}
document.addEventListener('touchstart', startMusicOnce, {once:true});
document.addEventListener('click', startMusicOnce, {once:true});

// Trái tim bay
function createHeart(x,y,size=3){
  const heart=document.createElement('div');
  heart.className='heart';
  heart.innerText='💖';
  heart.style.left=x+'px';
  heart.style.top=y+'px';
  heart.style.fontSize=size+'vw';
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),3000);
}

// Big heart nở bung
function bigHeartBoom(){
  const bigHeart=document.createElement('div');
  bigHeart.className='bigHeart';
  bigHeart.innerText='💖';
  document.body.appendChild(bigHeart);
  bigHeart.style.animation='heartBoom 1s forwards';
  setTimeout(()=>bigHeart.remove(),1500);
}

// Nội dung ý nghĩa
const texts=[
  "Từ khi gặp bạn, mỗi ngày của mình đều tràn ngập niềm vui. Hy vọng chúng ta sẽ luôn cùng nhau đi qua những ngày tháng hạnh phúc phía trước. 💖",
  "Bạn là người làm tim mình rung động mỗi ngày. Mọi nụ cười và ánh mắt đều khiến mình cảm thấy thật may mắn. 💖",
  "Cảm ơn bạn đã đến bên đời mình và làm mọi thứ trở nên tuyệt vời hơn. 💖"
];

function typeWriter(text,i=0){
  if(i<text.length){
    content.innerHTML+=text.charAt(i);
    setTimeout(()=>typeWriter(text,i+1),40);
  }
}

// Load cinematic
window.onload=()=>{
  bigHeartBoom();
  setTimeout(bigHeartBoom,1000);
  const text=texts[Math.floor(Math.random()*texts.length)];
  setTimeout(()=>{
    typeWriter(text);
    content.style.opacity=1;
  },2000);
}

// Trái tim theo touch/mouse
document.addEventListener('mousemove',e=>createHeart(e.clientX,e.clientY,2+Math.random()*3));
document.addEventListener('touchmove',e=>{
  const t=e.touches[0];
  if(t) createHeart(t.clientX,t.clientY,2+Math.random()*3);
});

// Trái tim rơi nền
setInterval(()=>{
  const x=Math.random()*window.innerWidth;
  const y=window.innerHeight;
  createHeart(x,y,2+Math.random()*3);
},500);
</script>
</body>
</html>
